    /* --- MOBILE/TABLET (SIDEBAR SLIDE) --- */
    @media (max-width: 1023px) {
      #sidebar {
        transform: translateX(-100%);
        height: 100vh;
        transition: transform 0.3s ease;
        position: fixed;
        top: 0;
        left: 0;
      }

      #sidebar.mobile-open {
        transform: translateX(0);
      }
    }

    /* --- DESKTOP (SIDEBAR COLLAPSE) --- */
    @media (min-width: 1024px) {
      #sidebar {
        width: 16rem;
        transition: width 0.3s ease;
        transform: none !important;
      }

      #sidebar.collapsed {
        width: 4.5rem;
      }

      /* sembunyikan teks menu saja, bukan svg */
      #sidebar.collapsed nav a span {
        opacity: 0;
        pointer-events: none;
      }

      /* layout nav */
      #sidebar nav a {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        white-space: nowrap;
        transition: padding 0.3s ease, justify-content 0.3s ease;
      }

      #sidebar.collapsed nav a {
        justify-content: center;
        padding-left: 1.2rem !important;
        padding-right: 1.2rem !important;
      }

      /* fix icon tetap tampil */
      #sidebar.collapsed a svg {
        opacity: 1 !important;
        width: 24px;
        height: 24px;
        fill: #1f2937;
      }
    }
  </style>

    <script>
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      const navLinks = document.querySelectorAll("#nav a");

      function isMobile() {
        return window.innerWidth < 1024;
      }

      function openSidebar() {
        if (isMobile()) {
          sidebar.classList.toggle("mobile-open");

          if (sidebar.classList.contains("mobile-open")) {
            overlay.classList.remove("hidden");
          } else {
            overlay.classList.add("hidden");
          }
        } else {
          sidebar.classList.toggle("collapsed");
        }
      }

      // Klik overlay → sidebar menutup
      overlay.addEventListener("click", () => {
        sidebar.classList.remove("mobile-open");
        overlay.classList.add("hidden");
      });

      // Klik menu navigation → sidebar menutup di mobile
      navLinks.forEach((link) => {
        link.addEventListener("click", () => {
          if (isMobile()) {
            sidebar.classList.remove("mobile-open");
            overlay.classList.add("hidden");
          }
        });
      });

      // Atur kondisi awal saat load/resize
      function handleSidebarState() {
        if (isMobile()) {
          sidebar.classList.remove("collapsed");
          sidebar.classList.remove("mobile-open");
          overlay.classList.add("hidden");
        } else {
          sidebar.classList.remove("mobile-open");
          overlay.classList.add("hidden");
        }
      }
      window.addEventListener("resize", handleSidebarState);
      window.addEventListener("load", handleSidebarState);
    </script>
