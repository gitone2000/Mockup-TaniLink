<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaniLink Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <style>
    /* --- MOBILE/TABLET (SIDEBAR SLIDE) --- */
    @media (max-width: 1023px) {
      #sidebar {
        transform: translateX(-100%);
        height: 100vh;
        transition: transform 0.3s ease;
        position: fixed;
        top: 0;
        left: 0;
      }

      #sidebar.mobile-open {
        transform: translateX(0);
      }
    }

    /* --- DESKTOP (SIDEBAR COLLAPSE) --- */
    @media (min-width: 1024px) {
      #sidebar {
        width: 16rem;
        transition: width 0.3s ease;
        transform: none !important;
      }

      #sidebar.collapsed {
        width: 4.5rem;
      }

      /* sembunyikan teks menu saja, bukan svg */
      #sidebar.collapsed nav a span {
        opacity: 0;
        pointer-events: none;
      }

      /* layout nav */
      #sidebar nav a {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        white-space: nowrap;
        transition: padding 0.3s ease, justify-content 0.3s ease;
      }

      #sidebar.collapsed nav a {
        justify-content: center;
        padding-left: 1.2rem !important;
        padding-right: 1.2rem !important;
      }

      /* fix icon tetap tampil */
      #sidebar.collapsed a svg {
        opacity: 1 !important;
        width: 24px;
        height: 24px;
        fill: #1f2937;
      }
    }
  </style>

  <body class="bg-gray-100">
    <!-- Header -->
    <header
      class="bg-gradient-to-r from-green-800 to-green-600 text-white py-4 px-6 flex justify-between items-center relative"
    >
      <button onclick="openSidebar()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-8 h-8 text-white cursor-pointer"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>
      <!-- Button -->
      <button
        id="adminMenuBtn"
        class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition"
      >
        <span class="text-sm font-medium">Administrator</span>

        <!-- icon panah -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </button>

      <!-- Dropdown -->
      <div
        id="adminDropdown"
        class="hidden absolute top-14 right-6 bg-white text-gray-700 rounded-md shadow-lg w-40 border border-gray-200 z-50"
      >
        <a href="./index.html">
          <button
            class="w-full text-left px-4 py-2 text-green-600 hover:bg-red-50"
          >
            Logout
          </button>
        </a>
      </div>
    </header>

    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside
        id="sidebar"
        class="w-64 bg-white shadow-lg fixed md:relative z-20"
      >
        <div class="p-6">
          <div class="flex items-center gap-2 mb-8">
            <div class="flex items-center justify-center">
              <img
                src="/assets/img/TaniLink (Gambar).png"
                alt="Logo"
                class="w-56 h-auto object-contain"
              />
            </div>
          </div>

          <nav class="space-y-2" id="nav">
            <a
              href="./admin-dashboard.html"
              class="flex items-center gap-3 px-4 py-3 bg-blue-500 text-white rounded-lg"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"
                />
              </svg>
              <span>Dashboard</span>
            </a>
            <a
              href="./admin-kategori.html"
              class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-lg"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2L2 7l10 5 10-5-10-5z" />
              </svg>
              <span>Data Kategori</span>
            </a>
            <a
              href="./admin-produk.html"
              class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-lg"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
              </svg>
              <span>Data Produk</span>
            </a>
            <a
              href="./admin-peminjaman.html"
              class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-lg"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M19 13H5v-2h14v2z" />
              </svg>
              <span>Data Peminjaman</span>
            </a>
            <a
              href="./admin-pengembalian.html"
              class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-lg"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
                />
              </svg>
              <span>Data Pengembalian</span>
            </a>
            <a
              href="./admin-laporan.html"
              class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-lg"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"
                />
              </svg>
              <span>Laporan</span>
            </a>
            <a
              href="./admin-user.html"
              class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-lg"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                />
              </svg>
              <span>Users</span>
            </a>
          </nav>
        </div>
      </aside>

      <div
        id="overlay"
        class="fixed inset-0 bg-black/40 backdrop-blur-sm z-10 hidden md:hidden"
      ></div>

      <!-- Main Content -->
      <main class="flex-1 p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Dashboard</h1>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
          <div
            class="bg-gradient-to-br from-green-400 to-green-500 rounded-xl p-6 text-white shadow-lg relative overflow-hidden"
          >
            <div class="absolute top-0 right-0 w-24 h-24 opacity-20">
              <svg fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2z"
                />
              </svg>
            </div>
            <div class="text-3xl font-bold mb-2">4</div>
            <div class="text-sm opacity-90">Total Pinjaman</div>
          </div>

          <div
            class="bg-gradient-to-br from-blue-400 to-blue-600 rounded-xl p-6 text-white shadow-lg relative overflow-hidden"
          >
            <div class="absolute top-0 right-0 w-24 h-24 opacity-20">
              <svg fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
                />
              </svg>
            </div>
            <div class="text-3xl font-bold mb-2">4</div>
            <div class="text-sm opacity-90">Sedang Dipinjam</div>
          </div>

          <div
            class="bg-gradient-to-br from-red-400 to-red-500 rounded-xl p-6 text-white shadow-lg relative overflow-hidden"
          >
            <div class="absolute top-0 right-0 w-24 h-24 opacity-20">
              <svg fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"
                />
              </svg>
            </div>
            <div class="text-3xl font-bold mb-2">14</div>
            <div class="text-sm opacity-90">Total Belum Kembali</div>
          </div>

          <div
            class="bg-gradient-to-br from-yellow-400 to-orange-400 rounded-xl p-6 text-white shadow-lg relative overflow-hidden"
          >
            <div class="absolute top-0 right-0 w-24 h-24 opacity-20">
              <svg fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M20 2H4c-1.11 0-1.99.89-1.99 2L2 22l4-4h14c1.11 0 2-.89 2-2V4c0-1.11-.89-2-2-2zM9 11H7V9h2v2zm4 0h-2V9h2v2zm4 0h-2V9h2v2z"
                />
              </svg>
            </div>
            <div class="text-3xl font-bold mb-2">4</div>
            <div class="text-sm opacity-90">Total Alat Rusak</div>
          </div>
        </div>

        <!-- Charts -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="bg-white rounded-xl shadow-lg p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4">
              Top 10 Terbanyak Dipinjam
            </h2>
            <canvas id="borrowChart"></canvas>
          </div>

          <div class="bg-white rounded-xl shadow-lg p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4">
              Top 10 Peminjam Terbanyak
            </h2>
            <canvas id="borrowerChart"></canvas>
          </div>
        </div>
      </main>
    </div>

    <script>
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      const navLinks = document.querySelectorAll("#nav a");

      function isMobile() {
        return window.innerWidth < 1024;
      }

      function openSidebar() {
        if (isMobile()) {
          sidebar.classList.toggle("mobile-open");

          if (sidebar.classList.contains("mobile-open")) {
            overlay.classList.remove("hidden");
          } else {
            overlay.classList.add("hidden");
          }
        } else {
          sidebar.classList.toggle("collapsed");
        }
      }

      // Klik overlay → sidebar menutup
      overlay.addEventListener("click", () => {
        sidebar.classList.remove("mobile-open");
        overlay.classList.add("hidden");
      });

      // Klik menu navigation → sidebar menutup di mobile
      navLinks.forEach((link) => {
        link.addEventListener("click", () => {
          if (isMobile()) {
            sidebar.classList.remove("mobile-open");
            overlay.classList.add("hidden");
          }
        });
      });

      // Atur kondisi awal saat load/resize
      function handleSidebarState() {
        if (isMobile()) {
          sidebar.classList.remove("collapsed");
          sidebar.classList.remove("mobile-open");
          overlay.classList.add("hidden");
        } else {
          sidebar.classList.remove("mobile-open");
          overlay.classList.add("hidden");
        }
      }

      window.addEventListener("resize", handleSidebarState);
      window.addEventListener("load", handleSidebarState);

      // Chart untuk Top 10 Terbanyak Dipinjam
      const borrowCtx = document.getElementById("borrowChart").getContext("2d");
      new Chart(borrowCtx, {
        type: "bar",
        data: {
          labels: [
            "Item 1",
            "Item 2",
            "Item 3",
            "Item 4",
            "Item 5",
            "Item 6",
            "Item 7",
            "Item 8",
          ],
          datasets: [
            {
              label: "Jumlah Pinjaman",
              data: [6, 3, 2, 2, 2, 2, 1, 0.5],
              backgroundColor: [
                "#7c2d12",
                "#6b7280",
                "#bef264",
                "#7c2d12",
                "#a3e635",
                "#22c55e",
                "#ec4899",
                "#c084fc",
              ],
              borderRadius: 4,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: {
              display: false,
            },
          },
          scales: {
            y: {
              beginAtZero: true,
              max: 8,
              ticks: {
                stepSize: 2,
              },
            },
          },
        },
      });

      // Chart untuk Top 10 Peminjam Terbanyak
      const borrowerCtx = document
        .getElementById("borrowerChart")
        .getContext("2d");
      new Chart(borrowerCtx, {
        type: "bar",
        data: {
          labels: [
            "User 1",
            "User 2",
            "User 3",
            "User 4",
            "User 5",
            "User 6",
            "User 7",
          ],
          datasets: [
            {
              label: "Jumlah Pinjaman",
              data: [6, 2, 2, 2, 2, 1, 1],
              backgroundColor: [
                "#e879f9",
                "#d4d4a8",
                "#22c55e",
                "#10b981",
                "#14b8a6",
                "#475569",
                "#a855f7",
              ],
              borderRadius: 4,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: {
              display: false,
            },
          },
          scales: {
            y: {
              beginAtZero: true,
              max: 8,
              ticks: {
                stepSize: 2,
              },
            },
          },
        },
      });
    </script>
    <script src="assets/js/dropdownuser.js"></script>
  </body>
</html>
