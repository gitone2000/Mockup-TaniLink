<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaniLink Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <style>
    /* --- MOBILE/TABLET (SIDEBAR SLIDE) --- */
    @media (max-width: 1023px) {
      #sidebar {
        transform: translateX(-100%);
        height: 100vh;
        transition: transform 0.3s ease;
        position: fixed;
        top: 0;
        left: 0;
      }

      #sidebar.mobile-open {
        transform: translateX(0);
      }
    }

    /* --- DESKTOP (SIDEBAR COLLAPSE) --- */
    @media (min-width: 1024px) {
      #sidebar {
        width: 16rem;
        transition: width 0.3s ease;
        transform: none !important;
      }

      #sidebar.collapsed {
        width: 4.5rem;
      }

      /* sembunyikan teks menu saja, bukan svg */
      #sidebar.collapsed nav a span {
        opacity: 0;
        pointer-events: none;
      }

      /* layout nav */
      #sidebar nav a {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        white-space: nowrap;
        transition: padding 0.3s ease, justify-content 0.3s ease;
      }

      #sidebar.collapsed nav a {
        justify-content: center;
        padding-left: 1.2rem !important;
        padding-right: 1.2rem !important;
      }

      /* fix icon tetap tampil */
      #sidebar.collapsed a svg {
        opacity: 1 !important;
        width: 24px;
        height: 24px;
        fill: #1f2937;
      }
    }
  </style>
  <body class="bg-gray-100">
    <!-- Header -->
    <header
      class="bg-gradient-to-r from-green-800 to-green-600 text-white py-4 px-6 flex justify-between items-center relative"
    >
      <button onclick="openSidebar()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-8 h-8 text-white cursor-pointer"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>
      <!-- Button -->
      <button
        id="adminMenuBtn"
        class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition"
      >
        <span class="text-sm font-medium">Administrator</span>

        <!-- icon panah -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </button>

      <!-- Dropdown -->
      <div
        id="adminDropdown"
        class="hidden absolute top-14 right-6 bg-white text-gray-700 rounded-md shadow-lg w-40 border border-gray-200 z-50"
      >
        <a href="./index.html">
          <button
            class="w-full text-left px-4 py-2 text-green-600 hover:bg-red-50"
          >
            Logout
          </button>
        </a>
      </div>
    </header>

    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside
        id="sidebar"
        class="w-64 bg-white shadow-lg fixed md:relative z-20"
      >
        <div class="p-6">
          <div class="flex items-center gap-2 mb-8">
            <div class="flex items-center justify-center">
              <img
                src="/assets/img/TaniLink (Gambar).png"
                alt="Logo"
                class="w-56 h-auto object-contain"
              />
            </div>
          </div>

          <nav class="space-y-2">
            <a
              href="./admin-dashboard.html"
              class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-lg"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"
                />
              </svg>
              <span>Dashboard</span>
            </a>
            <a
              href="./admin-kategori.html"
              class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-lg"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2L2 7l10 5 10-5-10-5z" />
              </svg>
              <span>Data Kategori</span>
            </a>
            <a
              href="./admin-produk.html"
              class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-lg"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
              </svg>
              <span>Data Produk</span>
            </a>
            <a
              href="./admin-peminjaman.html"
              class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-lg"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M19 13H5v-2h14v2z" />
              </svg>
              <span>Data Peminjaman</span>
            </a>
            <a
              href="./admin-pengembalian.html"
              class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-lg"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
                />
              </svg>
              <span>Data Pengembalian</span>
            </a>
            <a
              href="./admin-laporan.html"
              class="flex items-center gap-3 px-4 py-3 bg-blue-500 text-white rounded-lg"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"
                />
              </svg>
              <span>Laporan</span>
            </a>
            <a
              href="./admin-user.html"
              class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-lg"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                />
              </svg>
              <span>Users</span>
            </a>
          </nav>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Data Kategori</h1>
        <!-- Laporan Content -->
        <div id="laporanContent">
          <!-- Content Card -->
          <div class="bg-white rounded-lg shadow-md p-6">
            <!-- Tabs -->
            <div class="flex gap-2 mb-6">
              <button
                onclick="switchTab('peminjaman')"
                id="tabPeminjaman"
                class="bg-green-500 text-white px-6 py-2 rounded-md font-medium transition duration-200"
              >
                Peminjaman Barang
              </button>
              <button
                onclick="switchTab('pengembalian')"
                id="tabPengembalian"
                class="bg-orange-500 text-white px-6 py-2 rounded-md font-medium transition duration-200"
              >
                Pengembalian Barang
              </button>
              <button
                onclick="switchTab('rusak')"
                id="tabRusak"
                class="bg-red-500 text-white px-6 py-2 rounded-md font-medium transition duration-200"
              >
                Barang Rusak
              </button>
            </div>

            <!-- Tab Content -->
            <div id="tabContent" class="text-center py-12">
              <svg
                class="w-24 h-24 mx-auto text-gray-300 mb-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                />
              </svg>
              <p class="text-gray-500 text-lg mb-4">
                Klik tombol di bawah untuk download laporan
              </p>
              <button
                id="downloadBtn"
                onclick="downloadReport()"
                class="bg-blue-500 hover:bg-blue-600 text-white px-8 py-3 rounded-md font-medium transition duration-200 inline-flex items-center gap-2"
              >
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
                  />
                </svg>
                Download Laporan <span id="reportType">Peminjaman Barang</span>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="assets/js/dropdownuser.js"></script>
    <script src="assets/js/laporan.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script>
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      const navLinks = document.querySelectorAll("#nav a");

      function isMobile() {
        return window.innerWidth < 1024;
      }

      function openSidebar() {
        if (isMobile()) {
          sidebar.classList.toggle("mobile-open");

          if (sidebar.classList.contains("mobile-open")) {
            overlay.classList.remove("hidden");
          } else {
            overlay.classList.add("hidden");
          }
        } else {
          sidebar.classList.toggle("collapsed");
        }
      }

      // Klik overlay → sidebar menutup
      overlay.addEventListener("click", () => {
        sidebar.classList.remove("mobile-open");
        overlay.classList.add("hidden");
      });

      // Klik menu navigation → sidebar menutup di mobile
      navLinks.forEach((link) => {
        link.addEventListener("click", () => {
          if (isMobile()) {
            sidebar.classList.remove("mobile-open");
            overlay.classList.add("hidden");
          }
        });
      });

      // Atur kondisi awal saat load/resize
      function handleSidebarState() {
        if (isMobile()) {
          sidebar.classList.remove("collapsed");
          sidebar.classList.remove("mobile-open");
          overlay.classList.add("hidden");
        } else {
          sidebar.classList.remove("mobile-open");
          overlay.classList.add("hidden");
        }
      }
      window.addEventListener("resize", handleSidebarState);
      window.addEventListener("load", handleSidebarState);
    </script>
    <script>
      $(document).ready(function () {
        $("#alatTable").DataTable({
          // searching: false,
          // paging: false,
          // info: false
        });
      });
    </script>
  </body>
</html>
